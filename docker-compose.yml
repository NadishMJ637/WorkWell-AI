version: "3.9"

services:

  ollama:
    image: ollama/ollama:latest
    container_name: workwell-ollama

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama

    restart: unless-stopped

  workwell:
    build: .

    container_name: workwell-ai

    depends_on:
      - ollama

    ports:
      - "8501:8501"

    environment:
      OLLAMA_HOST: http://ollama:11434

    volumes:
      - ./knowledge:/app/knowledge
      - ./data:/app/data
      - ./rag_db:/app/rag_db

    restart: unless-stopped

volumes:

  ollama_data: